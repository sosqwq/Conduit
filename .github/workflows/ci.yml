name: Conduit checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Hurl 8.1.0
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          file=hurl-8.1.0-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/Orange-OpenSource/hurl/releases/download/8.1.0/$file" -o "$file"
          echo "b497e7ab328100c507f1f3323ebe7cc5990d831ae4f9473b74d40b02971da4ca  $file" | sha256sum --check
          tar -xzf "$file"
          echo "$RUNNER_TEMP/${file%.tar.gz}/bin" >> "$GITHUB_PATH"
      - name: Verify frontend, backend, official suites and tutorial
        run: ./scripts/check.sh
      - name: Build and verify the production Docker Compose stack
        run: ./scripts/check-production.sh
  milestone:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[m')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the verified milestone
        shell: bash
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          if [[ "$subject" =~ ^\[(m[0-9])\][[:space:]] ]]; then
            tag=${BASH_REMATCH[1]}
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

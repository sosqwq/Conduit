spring.application.name=conduit
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/conduit}
spring.datasource.username=${DATABASE_USERNAME:conduit}
spring.datasource.password=${DATABASE_PASSWORD:conduit}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
server.port=${PORT:8080}

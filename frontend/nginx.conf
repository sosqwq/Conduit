server {
    listen 8080;
    server_name _;
    root /srv/conduit;
    index index.html;

    # Docker Compose DNS keeps the web tier working when the API container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $conduit_api api:8080;

    location ~ ^/api(?:/|$) {
        proxy_pass http://$conduit_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # These route parameters may legitimately contain a filename-like suffix.
    location ~ ^/(?:article|editor|profile|tag)/ {
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|mjs|map|json|svg|ico|png|jpe?g|gif|webp|woff2?|ttf|webmanifest)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

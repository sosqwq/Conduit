<svg xmlns="http://www.w3.org/2000/svg" width="480" height="375" viewBox="0 0 480 375" role="img" aria-labelledby="title desc">
  <title id="title">一次健康检查的往返</title>
  <desc id="desc">从上往下读。HTTP 客户端向 Spring MVC 发送 GET /api/health。控制器让 PostgreSQL 执行 SELECT 1。若返回整数 1，客户端收到 HTTP 200 和状态 UP。若已启动的应用遇到数据库访问异常，返回 HTTP 503 和状态 DOWN。</desc>
<style>
  svg { --paper:#f8f6ee; --ink:#202e2b; --muted:#485b54; --edge:#61756c; --panel:#fffdf6; --green:#225d4c; --green-bg:#dfede1; --amber:#874b25; --amber-bg:#f5e5cd; --blue:#405c87; --blue-bg:#e7edf5; }
  @media (prefers-color-scheme: dark) {
    svg { --paper:#181e2c; --ink:#f0f2f7; --muted:#bfcbcc; --edge:#8d9ba7; --panel:#212b3a; --green:#9ddfc3; --green-bg:#253e39; --amber:#f3c39b; --amber-bg:#42342e; --blue:#b3ceff; --blue-bg:#2a374e; }
  }
  text { font-family:system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:var(--ink); }
  .label { font-size:18px; font-weight:650; }
  .note { font-size:15px; fill:var(--muted); }
  .mono { font: 15px ui-monospace,"DejaVu Sans Mono",monospace; fill:var(--ink); }
  .paper { fill:var(--paper); }
  .panel { fill:var(--panel); stroke:var(--edge); stroke-width:1.4; }
  .green { fill:var(--green-bg); stroke:var(--green); stroke-width:1.6; }
  .amber { fill:var(--amber-bg); stroke:var(--amber); stroke-width:1.6; }
  .blue { fill:var(--blue-bg); stroke:var(--blue); stroke-width:1.6; }
  .line { fill:none; stroke:var(--edge); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
  <style>
  .flow, .reply, .issue-flow, .stroke, .caution-line {
    fill:none; stroke:var(--green); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
  }
  .flow-head { fill:var(--green); }
  .guides { fill:none; stroke:var(--edge); stroke-width:1.35; stroke-dasharray:3 5; }
  .pin { fill:var(--green); stroke:none; }
  .reply { stroke:var(--blue); stroke-dasharray:5 4; }
  .reply-head { fill:var(--blue); }
  .issue-flow, .caution-line { stroke:var(--amber); }
  .issue-head { fill:var(--amber); }
  .caution { fill:var(--amber-bg); stroke:var(--amber); stroke-width:1.6; stroke-linejoin:round; }
  .issue-label { fill:var(--amber); font-size:16px; font-weight:650; }
  </style>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="flow-head" d="M0 0 10 5 0 10Z"/>
    </marker>

    <marker id="reply-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="reply-head" d="M0 0 10 5 0 10Z"/>
    </marker>
    <marker id="issue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="issue-head" d="M0 0 10 5 0 10Z"/>
    </marker>
  </defs>
  <rect class="paper" width="480" height="375"/>
  <!-- The lifelines separate the HTTP client, controller and database. Time runs down the page. -->
  <g class="guides">
    <path d="M70 95V304 M240 95V304 M410 95V304"/>
  </g>
  <g class="green">
    <rect class="blue" x="24" y="20" width="92" height="48" rx="7"/>
    <path class="stroke" style="stroke:var(--blue)" d="M24 32h92m-76 13 5 5-5 5m10 0h8"/>
    <rect x="197" y="20" width="86" height="48" rx="7"/>
    <path class="stroke" d="M209 35h62m-62 15h62"/>
    <circle class="pin" cx="216" cy="35" r="3"/><circle class="pin" cx="216" cy="50" r="3"/>
    <path class="amber" d="M373 31c0-7 17-12 37-12s37 5 37 12v26c0 7-17 12-37 12s-37-5-37-12Z"/>
    <ellipse class="stroke" style="stroke:var(--amber)" cx="410" cy="31" rx="37" ry="12"/>
    <path class="stroke" style="stroke:var(--amber)" d="M373 46c0 7 17 12 37 12s37-5 37-12"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="70" y="92">HTTP 客户端</text>
    <text x="240" y="92">Spring MVC</text>
    <text x="410" y="92">PostgreSQL</text>
  </g>
  <rect class="green" x="235" y="144" width="10" height="136" rx="4"/>
  <rect class="amber" x="405" y="188" width="10" height="47" rx="4"/>
  <g class="flow" marker-end="url(#flow-arrow)">
    <path d="M70 146H233"/>
    <path d="M245 190H403"/>
  </g>
  <g class="reply" marker-end="url(#reply-arrow)">
    <path d="M405 233H247"/>
    <path d="M235 278H72"/>
  </g>
  <g class="note" text-anchor="middle">
    <text class="mono" x="154" y="134">GET /api/health</text>
    <text class="mono" x="325" y="178">SELECT 1</text>
    <text x="325" y="221">返回整数 1</text>
    <text x="154" y="266">HTTP 200 · UP</text>
  </g>
  <path class="line" d="M24 317H456"/>
  <g transform="translate(24 333)">
    <path class="caution" d="m10 0 10 17H0Z"/>
    <path class="caution-line" d="M10 5v5m0 2v1"/>
    <text class="note" x="30" y="15">已启动后，数据库查询异常</text>
    <path class="issue-flow" d="M226 9h31" marker-end="url(#issue-arrow)"/>
    <text class="issue-label" x="274" y="15">HTTP 503 · DOWN</text>
  </g>
</svg>

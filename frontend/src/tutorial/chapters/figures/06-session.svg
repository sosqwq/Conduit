<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 408" role="img" aria-labelledby="title desc">
  <title id="title">刷新时如何恢复登录状态</title>
  <desc id="desc">浏览器读取 jwtToken。没有令牌时进入游客状态，有令牌时请求当前用户。有效响应使用户登录；4xx 清除令牌；网络或服务端故障则保留令牌以便重试。</desc>
<style>
  svg { --paper:#f8f6ee; --ink:#202e2b; --muted:#485b54; --edge:#61756c; --panel:#fffdf6; --green:#225d4c; --green-bg:#dfede1; --amber:#874b25; --amber-bg:#f5e5cd; --blue:#405c87; --blue-bg:#e7edf5; }
  @media (prefers-color-scheme: dark) {
    svg { --paper:#181e2c; --ink:#f0f2f7; --muted:#bfcbcc; --edge:#8d9ba7; --panel:#212b3a; --green:#9ddfc3; --green-bg:#253e39; --amber:#f3c39b; --amber-bg:#42342e; --blue:#b3ceff; --blue-bg:#2a374e; }
  }
  text { font-family:system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:var(--ink); }
  .label { font-size:18px; font-weight:650; }
  .note { font-size:15px; fill:var(--muted); }
  .mono { font: 15px ui-monospace,"DejaVu Sans Mono",monospace; fill:var(--ink); }
  .paper { fill:var(--paper); }
  .panel { fill:var(--panel); stroke:var(--edge); stroke-width:1.4; }
  .green { fill:var(--green-bg); stroke:var(--green); stroke-width:1.6; }
  .amber { fill:var(--amber-bg); stroke:var(--amber); stroke-width:1.6; }
  .blue { fill:var(--blue-bg); stroke:var(--blue); stroke-width:1.6; }
  .line { fill:none; stroke:var(--edge); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--edge)"/>
    </marker>
  </defs>
  <rect class="paper" width="480" height="408"/>
  <g class="line" marker-end="url(#arrow)">
    <path d="M228 58H321"/>
    <path d="M126 93V149"/>
    <path d="M254 172H380Q389 172 389 163V95"/>
    <path d="M104 226V310"/>
    <path d="M202 226V252Q202 262 212 262H335Q344 262 344 271V310"/>
    <path d="M447 350H454Q463 350 463 341V217Q463 208 454 208H255" stroke-dasharray="5 5"/>
  </g>
  <g class="note">
    <text x="275" y="48" text-anchor="middle" class="note">无令牌</text>
    <text x="138" y="127" class="note">有令牌</text>
    <text x="326" y="156" text-anchor="middle" class="note">4xx，清除令牌</text>
    <text x="116" y="281" class="note">有效用户</text>
    <text x="282" y="249" text-anchor="middle" class="note">网络错误 / 5xx</text>
    <text x="421" y="230" text-anchor="middle" class="note">重试</text>
  </g>

  <rect class="panel" x="23" y="24" width="205" height="69" rx="8"/>
  <g fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="44" cy="53" r="5"/>
    <path d="m48 57 8 8 4-4m-8 0 3-3"/>
  </g>
  <text x="72" y="53" class="label">浏览器读取令牌</text>
  <text x="72" y="77" class="mono">jwtToken</text>

  <rect class="amber" x="323" y="24" width="132" height="69" rx="34"/>
  <text x="389" y="65" text-anchor="middle" class="label">游客</text>

  <rect class="blue" x="43" y="151" width="210" height="74" rx="9"/>
  <g stroke="var(--blue)" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="67" cy="179" r="9"/>
    <path d="M67 173v6l4 3"/>
  </g>
  <text x="89" y="184" class="label">正在确认身份</text>
  <text x="89" y="208" class="mono">GET /api/user</text>

  <rect class="green" x="23" y="312" width="180" height="74" rx="12"/>
  <path d="m40 339 5 5 9-11" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="65" y="346" class="label">已登录</text>
  <text x="65" y="370" class="note">载入账号资料</text>

  <rect class="amber" x="252" y="312" width="195" height="74" rx="12"/>
  <g fill="none" stroke="var(--amber)" stroke-width="2">
    <circle cx="275" cy="339" r="8"/>
    <path d="M272 335v8m6-8v8"/>
  </g>
  <text x="296" y="346" class="label">暂不可用</text>
  <text x="296" y="370" class="note">保留令牌</text>
</svg>

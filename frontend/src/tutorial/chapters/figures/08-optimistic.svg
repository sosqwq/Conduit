<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">点收藏后，预测值如何得到确认或撤回</title>
  <desc id="desc">一篇文章已有两人收藏，小周点击收藏后，按钮先亮起，总数临时显示三。若写入成功且服务器返回六，客户端把已确认的总数更新为六。若请求失败，按钮回到未收藏的状态，重新显示二和本次错误。</desc>
<style>
  svg { --paper:#f8f6ee; --ink:#202e2b; --muted:#485b54; --edge:#61756c; --panel:#fffdf6; --green:#225d4c; --green-bg:#dfede1; --amber:#874b25; --amber-bg:#f5e5cd; --blue:#405c87; --blue-bg:#e7edf5; }
  @media (prefers-color-scheme: dark) {
    svg { --paper:#181e2c; --ink:#f0f2f7; --muted:#bfcbcc; --edge:#8d9ba7; --panel:#212b3a; --green:#9ddfc3; --green-bg:#253e39; --amber:#f3c39b; --amber-bg:#42342e; --blue:#b3ceff; --blue-bg:#2a374e; }
  }
  text { font-family:system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:var(--ink); }
  .label { font-size:18px; font-weight:650; }
  .note { font-size:15px; fill:var(--muted); }
  .mono { font: 15px ui-monospace,"DejaVu Sans Mono",monospace; fill:var(--ink); }
  .paper { fill:var(--paper); }
  .panel { fill:var(--panel); stroke:var(--edge); stroke-width:1.4; }
  .green { fill:var(--green-bg); stroke:var(--green); stroke-width:1.6; }
  .amber { fill:var(--amber-bg); stroke:var(--amber); stroke-width:1.6; }
  .blue { fill:var(--blue-bg); stroke:var(--blue); stroke-width:1.6; }
  .line { fill:none; stroke:var(--edge); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
  <style>
    .number { font-size:29px; font-weight:690; }
    .heart-off, .heart-on { stroke:var(--green); stroke-width:1.8; stroke-linejoin:round; }
    .heart-off { fill:none; }
    .heart-on { fill:var(--green); }
    .icon, .warning-icon { fill:none; stroke:var(--green); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .warning-icon { stroke:var(--amber); }
  </style>
  <rect class="paper" width="480" height="380"/>
  <defs>
    <path id="heart" d="M0 5C0 0 6-2 10 3c4-5 10-3 10 2 0 5-5 9-10 13C5 14 0 10 0 5Z"/>
  </defs>
  <text class="label" x="25" y="40">点击前</text>
  <text class="label" x="277" y="40">等待服务器</text>
  <rect class="panel" x="24" y="54" width="156" height="55" rx="27"/>
  <use href="#heart" class="heart-off" x="66" y="74"/>
  <text class="number" x="106" y="92">2</text>
  <path class="line" d="M190 81h65"/>
  <path class="line" d="m248 76 7 5-7 5"/>
  <text class="note" text-anchor="middle" x="221" y="68">点收藏</text>
  <rect class="green" x="275" y="54" width="180" height="55" rx="27"/>
  <use href="#heart" class="heart-on" x="331" y="74"/>
  <text class="number" x="371" y="92">3</text>
  <text class="note" x="26" y="139">上次确认是 2</text>
  <text class="note" x="277" y="139">按钮先显示预测值</text>
  <path class="line" d="M363 151v39m0-20H119v20"/>
  <path class="line" d="m115 185 4 5 4-5m236 0 4 5 4-5"/>

  <rect class="panel" x="18" y="202" width="209" height="158" rx="9"/>
  <circle class="green" cx="45" cy="229" r="11"/>
  <path class="icon" d="m39.5 229 3.5 3.5 7.5-8"/>
  <text class="label" x="67" y="235">请求成功</text>
  <use href="#heart" class="heart-on" x="39" y="265"/>
  <text class="number" x="74" y="283">6</text>
  <text class="note" x="35" y="316">若服务器返回 6，</text>
  <text class="note" x="35" y="338">用 6 更新这篇文章。</text>

  <rect class="panel" x="253" y="202" width="209" height="158" rx="9"/>
  <circle class="amber" cx="280" cy="229" r="11"/>
  <path class="warning-icon" d="M280 223v7m0 4v.5"/>
  <text class="label" x="302" y="235">请求失败</text>
  <use href="#heart" class="heart-off" x="274" y="265"/>
  <text class="number" x="309" y="283">2</text>
  <text class="note" x="270" y="316">撤下这次预测，</text>
  <text class="note" x="270" y="338">显示错误并允许重试。</text>
</svg>
